apiVersion: apps/v1
kind: Deployment
metadata:
  name: idma-minio
  namespace: bigdata-dev
  labels: {app: idma-minio, app.kubernetes.io/part-of: idma-poc}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: idma-minio}
  template:
    metadata:
      labels: {app: idma-minio}
    spec:
      # Docker Hub now denies anonymous pulls of minio/minio and minio/mc
      # (a MinIO distribution/licensing change, unrelated to this repo) —
      # both mirrored to our own registry instead. See idma-minio-init
      # below for the second one.
      imagePullSecrets:
        - name: ai-registry
      containers:
        - name: minio
          image: ai-repository.vnpt.vn/idma/idma-poc-minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef: {name: idma-minio-secret}
          ports:
            - {containerPort: 9000, name: api}
            - {containerPort: 9001, name: console}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: idma-minio
  namespace: bigdata-dev
  labels: {app: idma-minio, app.kubernetes.io/part-of: idma-poc}
spec:
  type: NodePort
  selector: {app: idma-minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000, nodePort: 30900}
    - {name: console, port: 9001, targetPort: 9001, nodePort: 30901}
---
# One-shot: creates the org-001/org-002 buckets, one scoped MinIO IAM user
# per org, and uploads the sample files. Safe to re-run (see minio/init.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: idma-minio-init
  namespace: bigdata-dev
  labels: {app: idma-minio-init, app.kubernetes.io/part-of: idma-poc}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: idma-minio-init}
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ai-registry
      initContainers:
        - name: wait-for-minio
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -sf http://idma-minio:9000/minio/health/live; do
                echo "waiting for minio..."; sleep 2;
              done
      containers:
        - name: minio-init
          image: ai-repository.vnpt.vn/idma/idma-poc-minio-mc:latest
          command: ["sh", "/init.sh"]
          env:
            - {name: MINIO_ENDPOINT, value: "http://idma-minio:9000"}
          envFrom:
            - secretRef: {name: idma-minio-secret}
          volumeMounts:
            - {name: init-script, mountPath: /init.sh, subPath: init.sh}
            - {name: seed-files, mountPath: /seed-files/org-001/README.txt, subPath: org-001-README.txt}
            - {name: seed-files, mountPath: /seed-files/org-001/q1-sales-summary.csv, subPath: org-001-q1-sales-summary.csv}
            - {name: seed-files, mountPath: /seed-files/org-001/notes/onboarding.md, subPath: org-001-notes-onboarding.md}
            - {name: seed-files, mountPath: /seed-files/org-002/README.txt, subPath: org-002-README.txt}
            - {name: seed-files, mountPath: /seed-files/org-002/q1-shipment-summary.csv, subPath: org-002-q1-shipment-summary.csv}
            - {name: seed-files, mountPath: /seed-files/org-002/notes/onboarding.md, subPath: org-002-notes-onboarding.md}
      volumes:
        - name: init-script
          configMap: {name: idma-minio-init-script}
        - name: seed-files
          configMap: {name: idma-minio-seed-files}
