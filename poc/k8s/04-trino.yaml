apiVersion: apps/v1
kind: Deployment
metadata:
  name: idma-trino
  namespace: bigdata-dev
  labels: {app: idma-trino, app.kubernetes.io/part-of: idma-poc}
spec:
  replicas: 1
  selector:
    matchLabels: {app: idma-trino}
  template:
    metadata:
      labels: {app: idma-trino}
    spec:
      containers:
        - name: trino
          image: trinodb/trino:latest
          ports:
            - containerPort: 8080
            - containerPort: 8443
          volumeMounts:
            - name: catalog
              mountPath: /etc/trino/catalog
              readOnly: true
            - name: access-control
              mountPath: /etc/trino/access-control.properties
              subPath: access-control.properties
              readOnly: true
            - name: server-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
              readOnly: true
            - name: tls
              mountPath: /etc/trino/tls/keystore.p12
              subPath: keystore.p12
              readOnly: true
          readinessProbe:
            httpGet: {path: /v1/info, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "1500m", memory: "2Gi"}
      volumes:
        - name: catalog
          configMap: {name: idma-trino-catalog}
        - name: access-control
          configMap: {name: idma-trino-access-control}
        - name: server-config
          configMap: {name: idma-trino-server-config}
        - name: tls
          secret: {secretName: idma-trino-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: idma-trino
  namespace: bigdata-dev
  labels: {app: idma-trino, app.kubernetes.io/part-of: idma-poc}
spec:
  type: NodePort
  selector: {app: idma-trino}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30843
