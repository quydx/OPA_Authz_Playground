            httpGet: {path: /api/v2/version, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            # 1Gi worked fine for 20 days on the stock image — OOMKilled
            # within minutes of switching to the custom image (adds
            # mlflow-skinny + transitive deps to every one of this
            # apiserver's 4 worker processes). Measured OOM at 1Gi;
            # scheduler/dag-processor are single-process daemons and
            # didn't need the same bump.
            requests: {cpu: "300m", memory: "768Mi"}
            limits: {cpu: "2000m", memory: "1536Mi"}
