            - {name: AIRFLOW__CORE__EXECUTOR, value: "LocalExecutor"}
            - {name: AIRFLOW__CORE__AUTH_MANAGER, value: "opa_auth_manager.auth_manager.OPAAuthManager"}
            - {name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN, value: "postgresql+psycopg2://poc:pocpass@idma-postgres:5432/airflow"}
            - {name: AIRFLOW__CORE__FERNET_KEY, value: ""}
            - {name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION, value: "true"}
            - {name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "false"}
            - {name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL, value: "http://idma-airflow-apiserver:8080/execution/"}
            - {name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK, value: "true"}
            # FabAuthManager's default session backend expects a "session"
            # table this POC never migrates in — signed-cookie sessions
            # need no table and are plenty for a demo (session dies if
            # SECRET_KEY isn't fixed and the apiserver restarts, which is
            # fine here).
            - {name: AIRFLOW__FAB__SESSION_BACKEND, value: "securecookie"}
            # Fixed so a session survives an apiserver restart — POC-only
            # value, same reasoning as AIRFLOW__API_AUTH__JWT_SECRET below.
            - {name: AIRFLOW__WEBSERVER__SECRET_KEY, value: "poc-airflow-webserver-secret-key"}
            - {name: OPA_URL, value: "http://idma-opa:8181"}
            # Separate from AIRFLOW__WEBSERVER__SECRET_KEY: signs/validates
            # the internal Task Execution API's JWTs (every task-instance
            # start/heartbeat handoff between scheduler and apiserver). Left
            # unset, each pod auto-generates its own random value on first
            # use, the scheduler-signed token then never validates against
            # the apiserver's own independently-generated secret, and every
            # task fails immediately with "Signature verification failed"
            # before it ever runs. Fixed here for the same reason the
            # docker-compose stack needed this fix. POC-only value.
            - {name: AIRFLOW__API_AUTH__JWT_SECRET, value: "poc-airflow-jwt-secret"}
            # train_sample_model's only mlflow-specific config — artifacts are
            # proxied through the tracking server (--serve-artifacts, see
            # 09-mlflow.yaml), so this pod never needs its own MinIO creds.
            - {name: MLFLOW_TRACKING_URI, value: "http://idma-mlflow:5000"}
            - {name: MLFLOW_DISABLE_AGENT_HINT, value: "1"}
            - {name: DEMO_DB_DSN, value: "postgresql://poc:pocpass@idma-postgres:5432/demo"}
            # luu_tru_dac_trung's two Feast touchpoints — a direct
            # Postgres write into sales_orders_features (Feast's own
            # offline-store table) and the feature server's own HTTP API
            # for materialize-incremental (never the Feast SDK — see that
            # task's docstring for why).
            - {name: FEAST_DB_DSN, value: "postgresql://poc:pocpass@idma-postgres:5432/feast"}
            - {name: FEAST_FEATURE_SERVER_URL, value: "http://idma-feast:6566"}
            # luu_tru_dac_trung's third Feast touchpoint — create/update a
            # feature view's registry schema by name before inserting its
            # rows (see poc/feast/registry_api.py / idma-feast-admin in
            # 11-feast.yaml).
            - {name: FEAST_ADMIN_URL, value: "http://idma-feast-admin:6568"}
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: dags, mountPath: /opt/airflow/dags/sales_etl.py, subPath: sales_etl.py}
            - {name: dags, mountPath: /opt/airflow/dags/hr_payroll_sync.py, subPath: hr_payroll_sync.py}
            - {name: dags, mountPath: /opt/airflow/dags/customer_export.py, subPath: customer_export.py}
            - {name: dags, mountPath: /opt/airflow/dags/org2_etl.py, subPath: org2_etl.py}
            - {name: dags, mountPath: /opt/airflow/dags/train_sample_model.py, subPath: train_sample_model.py}
            - {name: dags, mountPath: /opt/airflow/dags/train_eval_pipeline.py, subPath: train_eval_pipeline.py}
            - {name: dags, mountPath: /opt/airflow/dags/automl_wizard_pipeline.py, subPath: automl_wizard_pipeline.py}
            - {name: plugin, mountPath: /opt/airflow/plugins/opa_auth_manager/__init__.py, subPath: __init__.py}
            - {name: plugin, mountPath: /opt/airflow/plugins/opa_auth_manager/auth_manager.py, subPath: auth_manager.py}
