# NOTE: docker-compose's &airflow-common YAML anchor doesn't carry across
# `---`-separated documents once kubectl converts this to JSON (verified:
# kubectl reports "unknown anchor referenced" if you try) — so the same
# env/volumeMounts/volumes block is spelled out on each workload below
# instead of shared via anchor.
apiVersion: batch/v1
kind: Job
metadata:
  name: idma-airflow-init
  namespace: bigdata-dev
  labels: {app: idma-airflow-init, app.kubernetes.io/part-of: idma-poc}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: idma-airflow-init}
    spec:
      restartPolicy: Never
      containers:
        - name: airflow-init
          image: apache/airflow:3.0.6
          command: ["airflow", "db", "migrate"]
          env:
            - {name: AIRFLOW__CORE__EXECUTOR, value: "LocalExecutor"}
            - {name: AIRFLOW__CORE__AUTH_MANAGER, value: "opa_auth_manager.auth_manager.OPAAuthManager"}
            - {name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN, value: "postgresql+psycopg2://poc:pocpass@idma-postgres:5432/airflow"}
            - {name: AIRFLOW__CORE__FERNET_KEY, value: ""}
            - {name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION, value: "true"}
            - {name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "false"}
            - {name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL, value: "http://idma-airflow-apiserver:8080/execution/"}
            - {name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK, value: "true"}
            - {name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS, value: "alice:USER,bob:USER,carol:USER,dave:VIEWER,erin:USER"}
            - {name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS, value: "false"}
            - {name: OPA_URL, value: "http://idma-opa:8181"}
          volumeMounts:
            - {name: dags, mountPath: /opt/airflow/dags/sales_etl.py, subPath: sales_etl.py}
            - {name: dags, mountPath: /opt/airflow/dags/hr_payroll_sync.py, subPath: hr_payroll_sync.py}
            - {name: dags, mountPath: /opt/airflow/dags/customer_export.py, subPath: customer_export.py}
            - {name: dags, mountPath: /opt/airflow/dags/org2_etl.py, subPath: org2_etl.py}
            - {name: plugin, mountPath: /opt/airflow/plugins/opa_auth_manager/__init__.py, subPath: __init__.py}
            - {name: plugin, mountPath: /opt/airflow/plugins/opa_auth_manager/auth_manager.py, subPath: auth_manager.py}
            - {name: logs, mountPath: /opt/airflow/logs}
      volumes:
        - name: dags
          configMap: {name: idma-airflow-dags}
        - name: plugin
          configMap: {name: idma-airflow-plugin}
        - name: logs
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idma-airflow-apiserver
  namespace: bigdata-dev
  labels: {app: idma-airflow-apiserver, app.kubernetes.io/part-of: idma-poc}
spec:
  replicas: 1
  selector:
    matchLabels: {app: idma-airflow-apiserver}
  template:
    metadata:
      labels: {app: idma-airflow-apiserver}
    spec:
      containers:
        - name: airflow-apiserver
          image: apache/airflow:3.0.6
          command: ["airflow", "api-server"]
          env:
            - {name: AIRFLOW__CORE__EXECUTOR, value: "LocalExecutor"}
            - {name: AIRFLOW__CORE__AUTH_MANAGER, value: "opa_auth_manager.auth_manager.OPAAuthManager"}
            - {name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN, value: "postgresql+psycopg2://poc:pocpass@idma-postgres:5432/airflow"}
            - {name: AIRFLOW__CORE__FERNET_KEY, value: ""}
            - {name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION, value: "true"}
            - {name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "false"}
            - {name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL, value: "http://idma-airflow-apiserver:8080/execution/"}
            - {name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK, value: "true"}
            - {name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS, value: "alice:USER,bob:USER,carol:USER,dave:VIEWER,erin:USER"}
            - {name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS, value: "false"}
            - {name: OPA_URL, value: "http://idma-opa:8181"}
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: dags, mountPath: /opt/airflow/dags/sales_etl.py, subPath: sales_etl.py}
            - {name: dags, mountPath: /opt/airflow/dags/hr_payroll_sync.py, subPath: hr_payroll_sync.py}
            - {name: dags, mountPath: /opt/airflow/dags/customer_export.py, subPath: customer_export.py}
            - {name: dags, mountPath: /opt/airflow/dags/org2_etl.py, subPath: org2_etl.py}
            - {name: plugin, mountPath: /opt/airflow/plugins/opa_auth_manager/__init__.py, subPath: __init__.py}
            - {name: plugin, mountPath: /opt/airflow/plugins/opa_auth_manager/auth_manager.py, subPath: auth_manager.py}
            - {name: logs, mountPath: /opt/airflow/logs}
          readinessProbe:
            httpGet: {path: /api/v2/version, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: {cpu: "300m", memory: "512Mi"}
            limits: {cpu: "2000m", memory: "1Gi"}
      volumes:
        - name: dags
          configMap: {name: idma-airflow-dags}
        - name: plugin
          configMap: {name: idma-airflow-plugin}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: idma-airflow-apiserver
  namespace: bigdata-dev
  labels: {app: idma-airflow-apiserver, app.kubernetes.io/part-of: idma-poc}
spec:
  type: NodePort
  selector: {app: idma-airflow-apiserver}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30882
---
