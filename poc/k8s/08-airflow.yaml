apiVersion: v1
kind: Service
metadata:
  name: idma-airflow-apiserver
  namespace: bigdata-dev
  labels: {app: idma-airflow-apiserver, app.kubernetes.io/part-of: idma-poc}
spec:
  type: NodePort
  selector: {app: idma-airflow-apiserver}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30882
