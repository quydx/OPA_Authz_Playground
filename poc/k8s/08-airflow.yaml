            # the apiserver's own independently-generated secret, and every
            # task fails immediately with "Signature verification failed"
            # before it ever runs. Fixed here for the same reason the
            # docker-compose stack needed this fix. POC-only value.
            - {name: AIRFLOW__API_AUTH__JWT_SECRET, value: "poc-airflow-jwt-secret"}
            # train_sample_model's only mlflow-specific config — artifacts are
            # proxied through the tracking server (--serve-artifacts, see
            # 09-mlflow.yaml), so this pod never needs its own MinIO creds.
            - {name: MLFLOW_TRACKING_URI, value: "http://idma-mlflow:5000"}
            - {name: MLFLOW_DISABLE_AGENT_HINT, value: "1"}
            - {name: DEMO_DB_DSN, value: "postgresql://poc:pocpass@idma-postgres:5432/demo"}
            # luu_tru_dac_trung's two Feast touchpoints — a direct
            # Postgres write into sales_orders_features (Feast's own
            # offline-store table) and the feature server's own HTTP API
            # for materialize-incremental (never the Feast SDK — see that
