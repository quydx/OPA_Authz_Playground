            - {name: AIRFLOW__WEBSERVER__SECRET_KEY, value: "poc-airflow-webserver-secret-key"}
            - {name: OPA_URL, value: "http://idma-opa:8181"}
            # Separate from AIRFLOW__WEBSERVER__SECRET_KEY: signs/validates
