# Mirrors poc/trino/config.properties exactly in substance, with one
# hostname difference: the browser-facing issuer/auth-url below points
# at this cluster's one fixed entrypoint (10.165.22.31) instead of
# "localhost:8180" — see 10-keycloak.yaml and
# 00-configmap-airflow-webserver-config.yaml, which pin the same address
# for the same reason (NodePort has no Ingress/LoadBalancer hostname of
# its own). Server-side calls (token/jwks) use the in-cluster Service
# DNS name instead of docker-compose's "keycloak" hostname.
apiVersion: v1
kind: ConfigMap
metadata:
  name: idma-trino-server-config
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080

    # HTTPS, browser-facing only — Trino's own OAuth2 Web UI authenticator
    # hardcodes a check that the request is secure and refuses to run at all
    # over plain HTTP (there's no config flag to relax this, unlike the JWT
    # authenticator's allow-insecure-over-http below). Self-signed dev cert
    # (see 01-secrets.yaml's idma-trino-tls) — good for exactly one thing:
    # letting a browser complete a TLS handshake, not a real secret. Plain
    # :8080 stays up unauthenticated-by-transport for the backend's own
    # JWT bearer-token connection, which doesn't go through this filter.
    http-server.https.enabled=true
    http-server.https.port=8443
    http-server.https.keystore.path=/etc/trino/tls/keystore.p12
    http-server.https.keystore.key=trinokeystore

    # Authentication — Trino verifies Keycloak-issued JWTs itself (its own
    # SPI, not a reverse proxy). Two authenticator types, tried in order:
    #   OAUTH2 — the Web UI's own login: an unauthenticated browser hit
    #            redirects to Keycloak's login page. Since the browser
    #            already has an SSO session there (from logging into the
    #            frontend), this comes back signed in with no form to fill
    #            in — see keycloak/realm-idma.json's "trino-webui" client.
    #   JWT    — API/JDBC/CLI clients that already hold a bearer token
    #            present it directly, no redirect involved. The backend
    #            forwards the same access token it already validated on the
    #            incoming API call — see backend/app/trino_client.py.
    http-server.authentication.type=OAUTH2,JWT
    # Which of the two the Web UI itself uses — without this, Trino disables
    # the UI outright rather than guessing between multiple configured types.
    web-ui.authentication.type=OAUTH2

    http-server.authentication.jwt.key-file=http://idma-keycloak:8080/realms/idma/protocol/openid-connect/certs
    http-server.authentication.jwt.required-issuer=http://10.165.22.31:30180/realms/idma
    http-server.authentication.jwt.required-audience=trino
    http-server.authentication.jwt.principal-field=preferred_username

    # OAuth2 (Web UI). oidc.discovery is off because Keycloak's discovery
    # document reports every endpoint using its own KC_HOSTNAME — right
    # for the browser (10.165.22.31, see 10-keycloak.yaml), but unreachable
    # from *inside* this container, which needs the in-cluster Service DNS
    # name instead. So each endpoint is given explicitly: browser-facing
    # auth-url vs. server-facing token/jwks-url.
    http-server.authentication.oauth2.oidc.discovery=false
    http-server.authentication.oauth2.issuer=http://10.165.22.31:30180/realms/idma
    http-server.authentication.oauth2.auth-url=http://10.165.22.31:30180/realms/idma/protocol/openid-connect/auth
    http-server.authentication.oauth2.token-url=http://idma-keycloak:8080/realms/idma/protocol/openid-connect/token
    http-server.authentication.oauth2.jwks-url=http://idma-keycloak:8080/realms/idma/protocol/openid-connect/certs
    http-server.authentication.oauth2.client-id=trino-webui
    http-server.authentication.oauth2.client-secret=trino-webui-secret
    http-server.authentication.oauth2.scopes=openid
    http-server.authentication.oauth2.principal-field=preferred_username

    # POC only — no TLS between any of these containers.
    http-server.authentication.allow-insecure-over-http=true
    # Required once any http-server.authentication.type is set, even for
    # a single-node coordinator-only cluster like this one — Trino's
    # internal node-to-node calls authenticate with this shared secret.
    internal-communication.shared-secret=poc-trino-internal-secret
