# Same demo-only credential values as poc/docker-compose.yml — this is a
# POC, not hardened for production, but kept as Secret objects rather than
# plain Deployment env values as basic hygiene on a shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: idma-postgres-secret
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
type: Opaque
stringData:
  POSTGRES_USER: poc
  POSTGRES_PASSWORD: pocpass
  POSTGRES_DB: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: idma-minio-secret
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
type: Opaque
stringData:
  MINIO_ROOT_USER: pocadmin
  MINIO_ROOT_PASSWORD: pocadminpass
