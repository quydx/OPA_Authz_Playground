# Same demo-only credential values as poc/docker-compose.yml — this is a
# POC, not hardened for production, but kept as Secret objects rather than
# plain Deployment env values as basic hygiene on a shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: idma-postgres-secret
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
type: Opaque
stringData:
  POSTGRES_USER: poc
  POSTGRES_PASSWORD: pocpass
  POSTGRES_DB: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: idma-minio-secret
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
type: Opaque
stringData:
  MINIO_ROOT_USER: pocadmin
  MINIO_ROOT_PASSWORD: pocadminpass
---
apiVersion: v1
kind: Secret
metadata:
  name: idma-keycloak-secret
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
---
# Same self-signed dev cert as poc/trino/tls/keystore.p12 — good for
# exactly one thing: letting a browser complete a TLS handshake for
# Trino's OAuth2 Web UI authenticator (which refuses to run over plain
# HTTP, no config flag to relax it), not a real secret. `data:` (not
# stringData) because it's binary — base64 is the raw keystore bytes,
# regenerate with `base64 -w0 poc/trino/tls/keystore.p12` if the
# keystore ever changes. Password is the literal string "trinokeystore"
# (see 00-configmap-trino-server-config.yaml's keystore.key).
apiVersion: v1
kind: Secret
metadata:
  name: idma-trino-tls
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
type: Opaque
data:
  keystore.p12: 
