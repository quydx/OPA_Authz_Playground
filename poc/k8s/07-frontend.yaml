apiVersion: v1
kind: ConfigMap
metadata:
  name: idma-frontend-config
  namespace: bigdata-dev
  labels: {app.kubernetes.io/part-of: idma-poc}
data:
  # Overrides poc/frontend/config.js (a no-op locally). Computed from the
  # page's own hostname rather than a fixed IP, since NodePort means the
  # browser reaches every service at whichever node IP it used for the
  # frontend itself — this works regardless of which node someone connects
  # through. Ports below must match each Service's nodePort in this directory.
  # OPA and Postgres are ClusterIP-only here — no port means "internal only"
  # to the Services tab.
  config.js: |
    window.API_BASE = window.location.protocol + "//" + window.location.hostname + ":30801";
    // Same reasoning as API_BASE above — Keycloak has no fixed hostname
    // on this cluster (see 10-keycloak.yaml), so the login redirect has
    // to target whichever node this page itself was loaded from.
    window.KEYCLOAK_URL = window.location.protocol + "//" + window.location.hostname + ":30180";
    window.KEYCLOAK_REALM = "idma";
    window.KEYCLOAK_CLIENT_ID = "idma-frontend";
    window.SERVICES = [
      { name: "Frontend", port: 30300, path: "/", desc: "this UI" },
      { name: "Backend API", port: 30801, path: "/api/health", desc: "FastAPI" },
      { name: "Trino", port: 30843, scheme: "https:", path: "/ui/", desc: "coordinator UI — click to log in via Keycloak SSO (self-signed cert, browser will warn once)" },
      { name: "Airflow", port: 30882, path: "/auth/login/keycloak?next=", desc: "webserver — click to log in via Keycloak SSO" },
      { name: "MinIO API", port: 30900, path: "/", desc: "S3 endpoint" },
      { name: "MinIO Console", port: 30901, path: "/", desc: "browser UI" },
      { name: "MLflow", port: 30500, path: "/", desc: "tracking server UI + Model Registry" },
      { name: "Keycloak", port: 30180, path: "/admin/master/console/", desc: "authentication service — realm \"idma\"" },
      { name: "OPA", desc: "policy engine — ClusterIP only" },
      { name: "Postgres", desc: "authz · demo · airflow · mlflow DBs — ClusterIP only" },
    ];
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idma-frontend
  namespace: bigdata-dev
  labels: {app: idma-frontend, app.kubernetes.io/part-of: idma-poc}
spec:
  replicas: 1
  selector:
    matchLabels: {app: idma-frontend}
  template:
    metadata:
      labels: {app: idma-frontend}
    spec:
      imagePullSecrets:
        - name: ai-registry
      containers:
        - name: frontend
          image: ai-repository.vnpt.vn/idma/idma-poc-frontend:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: "20m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
      volumes:
        - name: config
          configMap: {name: idma-frontend-config}
---
apiVersion: v1
kind: Service
metadata:
  name: idma-frontend
  namespace: bigdata-dev
  labels: {app: idma-frontend, app.kubernetes.io/part-of: idma-poc}
spec:
  type: NodePort
  selector: {app: idma-frontend}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30300
