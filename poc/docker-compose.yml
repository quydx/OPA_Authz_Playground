version: "3.8"

x-airflow-common:
  &airflow-common
  # Built rather than pulled as-is — see airflow/Dockerfile — because the
  # train_sample_model Dag needs mlflow, which the stock image doesn't
  # carry. image: + build: together means every airflow-* service below
  # shares one built image instead of rebuilding per service.
  image: idma-airflow:local
  build: ./airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # The whole point of this service: swap Airflow's own authorization
    # engine for one that calls OPA — see airflow/plugins/opa_auth_manager.
    AIRFLOW__CORE__AUTH_MANAGER: opa_auth_manager.auth_manager.OPAAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://poc:pocpass@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # FabAuthManager's default session backend expects a "session" table
    # this POC never migrates in — signed-cookie sessions need no table
    # and are plenty for a demo (session dies if AIRFLOW__WEBSERVER__SECRET_KEY
    # isn't fixed and the apiserver restarts, which is fine here).
    AIRFLOW__FAB__SESSION_BACKEND: securecookie
    # Fixed so a session survives an apiserver restart — POC-only value.
    AIRFLOW__WEBSERVER__SECRET_KEY: poc-airflow-webserver-secret-key
    # Separate from the secret_key above: signs/validates the internal
    # Task Execution API's JWTs (used for every task-instance start/heartbeat
    # handoff between the scheduler and the apiserver). Left unset, each
    # container auto-generates its own random value on first use — the
    # scheduler-signed token then never validates against the apiserver's
    # own independently-generated secret, and every task fails immediately
    # with "Signature verification failed" before it ever runs. Fixed here
    # for the same reason as AIRFLOW__WEBSERVER__SECRET_KEY: POC-only value.
    AIRFLOW__API_AUTH__JWT_SECRET: poc-airflow-jwt-secret
    OPA_URL: http://opa:8181
    # train_sample_model's only mlflow-specific config — a tracking-server
    # URL. Artifacts are proxied through that server (mlflow's
    # --serve-artifacts mode — see mlflow/Dockerfile), so this container
    # never needs its own MinIO credentials to log a model.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_DISABLE_AGENT_HINT: "1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config/webserver_config.py:/opt/airflow/webserver_config.py:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    opa:
      condition: service_started
    keycloak:
      condition: service_started
    mlflow:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: pocpass
      POSTGRES_DB: demo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr", ":8181", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8181:8181"

  # MLflow tracking server + Model Registry — backend store is its own
  # Postgres database (see postgres/init/05-create-mlflow-db.sql), same
  # "one instance, separate database" pattern as authz/demo/airflow.
  # --serve-artifacts (mlflow/Dockerfile) proxies every artifact
  # upload/download through this server, so it's the only thing in the
  # whole stack that holds the MinIO mlflowsvc credential — the Airflow
  # training Dag and the backend's model-serving code only ever need this
  # server's HTTP URL, never MinIO directly.
  mlflow:
    build: ./mlflow
    environment:
      # +psycopg2 explicit for the same reason AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
      # is above: SQLAlchemy's bare "postgresql://" now prefers the psycopg
      # (v3) driver, which isn't installed here — only psycopg2-binary is.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://poc:pocpass@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: s3://mlflow-artifacts/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlflowsvc
      AWS_SECRET_ACCESS_KEY: mlflowSecretKey789
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Authentication service (see IDMA Authen & Authz.MD — "IDMA use Keycloak
  # as Authentication service"). Dev mode (KC_DB unset -> dev-file), no
  # volume mounted for its data directory — every container recreate
  # re-imports the realm fresh from keycloak/realm-idma.json, same
  # idempotent-by-design spirit as minio/init.sh. Demo users
  # (alice/bob/carol/dave/erin) all have password == username.
  keycloak:
    # Bumped from 25.0.6 -> 26.4.5 to match the SPI version the VNPT CAS
    # provider jar below was built against (keycloak-cas-26.4.5-vnpt-*.jar).
    # A cross-major mismatch here is the most common cause of a provider
    # failing to load on start-dev's automatic build step.
    image: quay.io/keycloak/keycloak:26.4.5
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-idma.json:/opt/keycloak/data/import/realm-idma.json:ro
      # VNPT CAS identity-broker plugin (see keycloak/README or the jar's
      # own META-INF/services) — dropped into providers/ so start-dev's
      # automatic build step picks it up. Optional HRM-enrichment env vars
      # (JDBC_URL/JDBC_USERNAME/JDBC_PASSWORD/JDBC_SCHEMA, HIKARI_*,
      # HRM_UNIT_GROUP_MAPPINGS) are intentionally unset — the plugin runs
      # in fallback mode (email = username@vnpt.vn) without them.
      - ./keycloak/keycloak-cas-26.4.5-vnpt-1.1.6.jar:/opt/keycloak/providers/keycloak-cas-26.4.5-vnpt-1.1.6.jar:ro
    ports:
      - "8180:8080"

  trino:
    image: trinodb/trino:latest
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/tls:/etc/trino/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      keycloak:
        condition: service_started

  minio:
    image: pgsty/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pocadmin
      MINIO_ROOT_PASSWORD: pocadminpass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the org-001/org-002 buckets, a MinIO user per org
  # scoped to its own bucket by IAM policy (not OPA — see README.md's
  # "Storage isolation" section), and uploads the sample files. Re-running
  # this against an already-provisioned MinIO is safe — every step in
  # minio/init.sh either uses --ignore-existing or is idempotent by design.
  minio-init:
    image: pgsty/minio:latest
    entrypoint: sh
    command: ["/init.sh"]
    environment:
      MINIO_ROOT_USER: pocadmin
      MINIO_ROOT_PASSWORD: pocadminpass
    volumes:
      - ./minio/init.sh:/init.sh:ro
      - ./minio/seed-files:/seed-files:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      AUTHZ_DB_URL: postgresql://poc:pocpass@postgres:5432/authz
      OPA_URL: http://opa:8181
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: postgres
      MINIO_ENDPOINT: http://minio:9000
      # iss claim on tokens minted by Keycloak is fixed by KC_HOSTNAME above
      # to the address the browser uses (localhost:8180) regardless of which
      # network path a given request took — the backend verifies against
      # that same value, and fetches the signing keys over the internal
      # docker network (a different address is fine; JWKS lookup and issuer
      # matching are independent checks).
      KEYCLOAK_ISSUER: http://localhost:8180/realms/idma
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/idma/protocol/openid-connect/certs
      # Users CRUD (see app/keycloak_admin.py): the backend's own service
      # account, confined to realm-management's manage-users/view-users
      # client roles (see keycloak/realm-idma.json) — never the master
      # admin/admin login.
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: idma
      KEYCLOAK_ADMIN_CLIENT_ID: idma-backend-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: idma-backend-admin-secret
      # Models tab (app/mlflow_client.py): list registered models/versions,
      # deploy one (set the "production" alias), and load+serve the
      # currently-deployed model in-process. Artifacts come back proxied
      # through this URL (mlflow's --serve-artifacts mode) — the backend
      # never talks to MinIO for this, same reasoning as the Airflow Dag.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      trino:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      mlflow:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Time-series anomaly detection (train + infer in one request), delivered
  # as a prebuilt image — not on any registry. Load it once before `up`:
  #   tar -C ../anomaly_detection_docker_and_doc/anomaly-service_0.1.0-cpu -cf - . | docker load
  # API contract: ../anomaly_detection_docker_and_doc/anomaly-service_0.1.0_openapi.json
  # Stateless (persistence off). Reachable in-network at http://anomaly:8000.
  anomaly:
    image: anomaly-service:0.1.0-cpu
    pull_policy: never
    environment:
      TRAIN_MAX_CONCURRENCY: "2"
      PIPELINE_TIMEOUT_SECONDS: "60"
    ports:
      - "8002:8000"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    # Seed SimpleAuthManager's password file before start: every user is
    # already present, so it generates nothing and uses these passwords.
    entrypoint: /bin/bash
    command: ["-c", "printf '%s\\n' \"$$AIRFLOW_DEMO_PASSWORDS\" > /opt/airflow/simple_auth_manager_passwords.json.generated && exec airflow api-server"]
    ports:
      - "8082:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  airflow-logs:
  miniodata:
